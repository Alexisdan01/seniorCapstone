<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Community image placeholder</title>
  <desc id="desc">Placeholder image for the UWM community section.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffecee"/>
      <stop offset="100%" stop-color="#ffc5ae"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1200" fill="url(#bg)"/>
