  <text x="500" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#b12029">Community Image</text>
  <text x="500" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#4d212a">Upload assets/images/community-student.jpg</text>
